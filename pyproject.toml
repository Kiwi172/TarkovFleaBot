[project]
name = "flea-bot"
version = "0.1.0"
description = "Flea market price analysis and UI automation for SPT (offline single-player Tarkov)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # --- data / scraping -------------------------------------------------
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    # --- persistence -----------------------------------------------------
    "sqlalchemy>=2.0",
    # --- vision ----------------------------------------------------------
    "opencv-python>=4.9",
    "numpy>=1.26",
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    # --- input -----------------------------------------------------------
    # pydirectinput is Windows-only (ctypes SendInput). On Linux the input
    # layer falls back to pyautogui; see flea_bot.input.backends.
    "pydirectinput>=1.0.4; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform != 'win32'",
    # --- orchestration / ops ---------------------------------------------
    "transitions>=0.9",
    "loguru>=0.7",
    "keyboard>=0.13.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
flea-bot = "flea_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flea_bot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults; B008 is unavoidable.
"src/flea_bot/cli.py" = ["B008"]
# Nested `with` reads better in tests: one context is the subject under test,
# the other is the assertion. Collapsing them obscures which is which.
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.10"
packages = ["flea_bot"]
mypy_path = "src"
ignore_missing_imports = true
